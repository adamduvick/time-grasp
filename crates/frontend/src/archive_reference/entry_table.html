<!-- ARIA Grid (interactive, editable cells) for Entry -->

<div class="entry-grid" role="grid" aria-label="Entries" aria-rowcount="2" aria-colcount="5">
    <!-- Header row -->
    <div class="entry-grid__row entry-grid__row--header" role="row" aria-rowindex="1">
        <div class="entry-grid__cell entry-grid__cell--header col-name" role="columnheader" aria-colindex="1"
            aria-sort="none">
            Name
        </div>

        <div class="entry-grid__cell entry-grid__cell--header col-note" role="columnheader" aria-colindex="2"
            aria-sort="none">
            Note
        </div>

        <div class="entry-grid__cell entry-grid__cell--header col-category" role="columnheader" aria-colindex="3"
            aria-sort="ascending">
            Category
        </div>

        <div class="entry-grid__cell entry-grid__cell--header col-start-time" role="columnheader" aria-colindex="4"
            aria-sort="none">
            Start Time
        </div>

        <div class="entry-grid__cell entry-grid__cell--header col-duration" role="columnheader" aria-colindex="5"
            aria-sort="none">
            Duration
        </div>
    </div>

    <!-- Data row (rowindex=2 because header consumes rowindex=1) -->
    <div class="entry-grid__row" role="row" aria-rowindex="2" aria-selected="false" data-row-id="entry_01">
        <!-- Active cell example: this is the one that is tabbable right now -->
        <div class="entry-grid__cell col-name is-active" role="gridcell" aria-colindex="1" tabindex="0"
            aria-label="Name" data-column="name">
            <!-- Display mode -->
            <span class="cell-text">Practice scales</span>

            <!-- Edit mode (shown for sketch); in real UI you’d toggle this -->
            <!-- If you show the input, it should receive focus, not the gridcell. -->
            <!-- You can do either:
           A) focus stays on gridcell and you use contenteditable (harder), or
           B) gridcell enters "edit mode" and focus moves into the input (common). -->
            <!-- Here’s option B: -->
            <input class="cell-editor" type="text" value="Practice scales" aria-label="Edit name" />
        </div>

        <div class="entry-grid__cell col-note" role="gridcell" aria-colindex="2" tabindex="-1" aria-label="Note"
            data-column="note">
            <span class="cell-text">Alternate picking focus</span>
        </div>

        <div class="entry-grid__cell col-category" role="gridcell" aria-colindex="3" tabindex="-1" aria-label="Category"
            data-column="category">
            <span class="cell-text">Music Practice</span>
        </div>

        <div class="entry-grid__cell col-start-time" role="gridcell" aria-colindex="4" tabindex="-1"
            aria-label="Start time" data-column="start_time">
            <time datetime="2025-12-30T18:15:00-06:00">2025-12-30 18:15</time>
        </div>

        <div class="entry-grid__cell col-duration" role="gridcell" aria-colindex="5" tabindex="-1" aria-label="Duration"
            data-column="duration">
            <span class="cell-text">20m</span>
        </div>
    </div>
</div>
