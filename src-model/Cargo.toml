[package]
name = "model"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.42"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "macros",
    "sqlite",
    "migrate",
    "uuid",
    "chrono",
] }
uuid = { version = "1", features = ["serde", "v4"] }
