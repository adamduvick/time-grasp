[workspace]
resolver = "3"
members = [
    "apps/src-tauri",
    "crates/model",
    "crates/backend",
    "crates/frontend",
]

[workspace.package]
authors = ["Adam Duvick"]
description = "A YNAB-style time budgetting application"
edition = "2024"
homepage = "https://github.com/adamduvick/time-grasp/"
readme = "README.md"
repository = "https://github.com/adamduvick/time-grasp/"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# pedantic = "warn"

[workspace.dependencies]
# members
backend = { path = "./crates/backend", default-features = false }
frontend = { path = "./crates/frontend", default-features = false }
model = { path = "./crates/model", default-features = false }

# member deps
anyhow = { version = "1.0.100", default-features = false }
async-trait = { version = "0.1.89", default-features = false }
chrono = { version = "0.4.42", default-features = false }
console_error_panic_hook = { version = "0.1.7", default-features = false }
js-sys = { version = "0.3", default-features = false }
leptos = { version = "0.8", default-features = false }
rand = { version = "0.9.2", default-features = false }
reactive_stores = { version = "0.3.1", default-features = false }
serde = { version = "1", default-features = false }
serde_json = { version = "1", default-features = false }
serde-wasm-bindgen = { version = "0.6", default-features = false }
sqlx = { version = "0.8", default-features = false }
tauri = { version = "2", default-features = false }
tauri-plugin-opener = { version = "2", default-features = false }
thiserror = { version = "2.0.17", default-features = false }
time = { version = "0.3.44", default-features = false }
tokio = { version = "1", default-features = false }
tracing = { version = "0.1.41", default-features = false }
uuid = { version = "1", default-features = false }
wasm-bindgen = { version = "0.2", default-features = false }
wasm-bindgen-futures = { version = "0.4", default-features = false }
